[package]
name = "track"
version = "0.7.2"
edition = "2024"
rust-version = "1.88"

[dependencies]
ansi-to-tui = "8.0.1"
clap = { version = "4.6.9", features = ["derive"] }
crossterm = { version = "0.29.0", features = ["use-dev-tty"] }
ratatui = "0.30.2"
regex = "1.13.1"
signal-hook = "0.3.18"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.3"

[profile.release]
lto = true
codegen-units = 1
strip = true
